<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232a78d6'%3E%3Crect x='2.5' y='4.5' width='7' height='6' rx='1.8'/%3E%3Crect x='11.5' y='4.5' width='10' height='6' rx='1.8' opacity='.45'/%3E%3Crect x='2.5' y='13.5' width='10.5' height='6' rx='1.8' opacity='.45'/%3E%3Crect x='15' y='13.5' width='6.5' height='6' rx='1.8'/%3E%3C/svg%3E" />
    <meta
      name="description"
      content="TokenTicks counts the tokens in a prompt across AI models and shows what each one costs to run."
    />
    <title>TokenTicks — prompt token &amp; cost analytics</title>
    <script>
      // Stamp the saved theme before first paint so a dark-mode reload never flashes light.
      try {
        var t = localStorage.getItem('tokenticks.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
