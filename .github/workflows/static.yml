# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["claude/prompt-token-counter-app-3ogg10"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
         node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          # Supplied from repository Variables (Settings -> Secrets and
          # variables -> Actions -> Variables). All of these are public by
          # design: Vite inlines VITE_ values into the browser bundle, and the
          # Supabase anon key is meant to be public because RLS is what
          # protects the data. Never put the service-role key here.
          #
          # When they are unset the build still succeeds and the site runs in
          # backend-free mode: the token counter and cost dashboard work, and
          # accounts and paid features report as unavailable.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_LEMON_CHECKOUT_URL: ${{ vars.VITE_LEMON_CHECKOUT_URL }}
          VITE_LEMON_VARIANT_PRO_MONTHLY: ${{ vars.VITE_LEMON_VARIANT_PRO_MONTHLY }}
          VITE_LEMON_VARIANT_PRO_ANNUAL: ${{ vars.VITE_LEMON_VARIANT_PRO_ANNUAL }}
          VITE_LEMON_VARIANT_TEAM_MONTHLY: ${{ vars.VITE_LEMON_VARIANT_TEAM_MONTHLY }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
