# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["claude/prompt-token-counter-app-3ogg10"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
         node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          # Supplied from repository Variables (Settings -> Secrets and
          # variables -> Actions -> Variables). All of these are public by
          # design: Vite inlines VITE_ values into the browser bundle, and the
          # Supabase anon key is meant to be public because RLS is what
          # protects the data. Never put the service-role key here.
          #
          # When they are unset the build still succeeds and the site runs in
          # backend-free mode: the token counter and cost dashboard work, and
          # accounts and paid features report as unavailable.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_LEMON_CHECKOUT_URL: ${{ vars.VITE_LEMON_CHECKOUT_URL }}
          # Public address; a repository Variable, not a Secret. Unset means the
          # Contact support links do not render at all - see lib/support.ts.
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_LEMON_VARIANT_PRO_MONTHLY: ${{ vars.VITE_LEMON_VARIANT_PRO_MONTHLY }}
          VITE_LEMON_VARIANT_PRO_ANNUAL: ${{ vars.VITE_LEMON_VARIANT_PRO_ANNUAL }}
          VITE_LEMON_VARIANT_TEAM_MONTHLY: ${{ vars.VITE_LEMON_VARIANT_TEAM_MONTHLY }}
      # A build with the Supabase variables missing succeeds and silently ships
      # the backend-free site, so a green run is not evidence that the config
      # landed. This makes the log say, and fails loudly on the one mistake
      # that is easy to make and invisible: setting them as Secrets instead of
      # Variables, or misspelling a name, so `vars.*` resolves empty.
      - name: Verify build configuration
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL is not set — deploying in backend-free mode."
            echo "The counter and cost dashboard work; accounts and paid tabs report as unavailable."
            echo "To enable them, add it under Settings → Secrets and variables → Actions → *Variables*."
            exit 0
          fi

          host="$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://##; s#/.*$##')"
          echo "VITE_SUPABASE_URL is set (host: $host)"

          # Vite only inlines VITE_-prefixed values it can actually see at build
          # time. Confirm it reached the bundle rather than trusting that it did.
          if grep -rq "$host" dist/assets/; then
            echo "Confirmed: the Supabase host is inlined in the built bundle."
          else
            echo "::error::VITE_SUPABASE_URL is set but does not appear in dist/. The build did not pick it up."
            exit 1
          fi

          if grep -rq '"role":"service_role"' dist/assets/ 2>/dev/null; then
            echo "::error::A service-role key appears in the client bundle. Remove it immediately and rotate the key."
            exit 1
          fi
          echo "Confirmed: no service-role key in the bundle."

      # Billing has the same failure mode as the Supabase config and one more
      # besides: a checkout variable that never reaches the bundle produces a
      # site where the Upgrade button cannot open anything. This reads the
      # built bundle back and prints what shipped. Report-only - a deployment
      # without billing configured is a supported state, not a broken build.
      - name: Report billing configuration
        if: always()
        run: node scripts/billing-preflight.mjs dist || true

      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
